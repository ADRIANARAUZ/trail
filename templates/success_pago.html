<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inscripción Confirmada - Trail 2026</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1516216628259-2225a984a9c5?q=80&w=2000&auto=format&fit=crop') no-repeat center center/cover;
            z-index: -1;
            filter: brightness(0.3);
        }

        .success-card {
            max-width: 480px;
            width: 100%;
            text-align: center;
            padding: clamp(24px, 6vw, 40px);
            border: 1px solid rgba(204, 255, 0, 0.4);
        }

        .success-icon {
            font-size: clamp(56px, 16vw, 80px);
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(204, 255, 0, 0.5);
        }

        .success-title {
            font-size: clamp(2.2rem, 9vw, 3.5rem) !important;
            color: white;
            font-family: 'Teko';
            margin: 0;
            line-height: 1;
        }

        .success-nombre {
            color: #ccff00;
            font-family: 'Teko';
            font-size: clamp(1.2rem, 5vw, 1.5rem);
            margin: 8px 0 16px;
        }

        .success-msg {
            color: #cbd5e1;
            font-size: clamp(0.82rem, 3vw, 0.95rem);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn-descarga {
            display: block;
            width: 100%;
            padding: 16px;
            background: #ccff00;
            color: black;
            border: none;
            border-radius: 8px;
            font-family: 'Teko';
            font-size: clamp(1.1rem, 4vw, 1.3rem);
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .btn-descarga:hover {
            filter: brightness(1.08);
        }

        .btn-descarga:active {
            transform: scale(0.98);
        }

        .btn-descarga:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-volver {
            display: block;
            margin-top: 20px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.88rem;
            transition: 0.2s;
        }

        .btn-volver:hover {
            color: white;
        }

        #certificado-oculto {
            position: absolute;
            left: -9999px;
            top: -9999px;
        }
    </style>
</head>

<body>
    <div class="bg-overlay"></div>

    <div class="main-layout"
        style="display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;">
        <div class="glass-container success-card">
            <div class="success-icon">✅</div>
            <h1 class="success-title">¡ESTÁS DENTRO!</h1>
            <p class="success-nombre">{{ nombre }}</p>
            <p class="success-msg">
                Tu inscripción está confirmada. Haz clic abajo para obtener tu comprobante oficial.
            </p>
            <button id="btn-descarga-directa" class="btn-descarga" onclick="generarDescargaDirecta()">
                ⬇️ DESCARGAR CERTIFICADO PDF
            </button>
            <a href="/" class="btn-volver">← VOLVER AL INICIO</a>
        </div>
    </div>

    <div id="certificado-oculto"></div>

    <script>
        function generarDescargaDirecta() {
            const btn = document.getElementById('btn-descarga-directa');
            btn.innerText = "⏳ GENERANDO...";
            btn.disabled = true;

            fetch('/certificado/{{ cedula }}')
                .then(r => r.text())
                .then(html => {
                    const cont = document.getElementById('certificado-oculto');
                    cont.innerHTML = html;
                    const botonExtra = cont.querySelector('.btn-imprimir');
                    if (botonExtra) botonExtra.remove();
                    const elemento = cont.querySelector('.certificado-box');
                    const opciones = {
                        margin: 0,
                        filename: 'Certificado_Trail_{{ cedula }}.pdf',
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 3, useCORS: true },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
                    };
                    html2pdf().set(opciones).from(elemento).save().then(() => {
                        btn.innerText = "⬇️ DESCARGAR CERTIFICADO PDF";
                        btn.disabled = false;
                        cont.innerHTML = "";
                    });
                })
                .catch(err => {
                    console.error(err);
                    alert("Error al generar el PDF.");
                    btn.disabled = false;
                    btn.innerText = "⬇️ DESCARGAR CERTIFICADO PDF";
                });
        }
    </script>
</body>

</html>
