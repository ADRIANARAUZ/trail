<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Consultar Estado</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        .check-card {
            max-width: 480px;
            width: 100%;
            text-align: center;
            padding: 36px 24px;
        }

        .check-title {
            font-size: clamp(2rem, 8vw, 3rem) !important;
        }

        .check-sub {
            font-size: clamp(0.85rem, 3vw, 1rem);
        }

        .check-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid #1e293b;
            padding: 16px;
            color: white;
            border-radius: 8px;
            font-family: 'Roboto';
            font-size: clamp(1rem, 4vw, 1.2rem);
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 16px;
            transition: 0.2s;
            appearance: none;
        }

        .check-input:focus {
            outline: none;
            border-color: #ccff00;
            box-shadow: 0 0 0 3px rgba(204, 255, 0, 0.12);
        }

        .error-msg {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff4757;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 16px;
            text-align: center;
        }

        .btn-buscar {
            display: block;
            width: 100%;
            padding: 16px;
            background: #ccff00;
            color: black;
            border: none;
            border-radius: 8px;
            font-family: 'Teko';
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }

        .btn-buscar:hover {
            filter: brightness(1.1);
        }

        .btn-buscar:active {
            transform: scale(0.98);
        }

        .btn-cancelar {
            display: block;
            margin-top: 16px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .btn-cancelar:hover {
            color: white;
        }
    </style>
</head>

<body>
    <div class="bg-overlay"></div>
    <div class="main-layout" style="justify-content: center; align-items: center; min-height: 100vh; padding: 20px;">
        <div class="glass-container check-card">
            <h1 class="big-title check-title">CONSULTA TU ESTADO</h1>
            <p class="hero-text check-sub">Ingresa tu cédula para recuperar tu inscripción.</p>

            {% if error %}
            <div class="error-msg">⚠️ {{ error }}</div>
            {% endif %}

            <form action="/check" method="POST">
                <input type="tel" name="cedula" class="check-input" placeholder="0000000000" maxlength="10"
                    inputmode="numeric" autocomplete="off" required autofocus>
                <button type="submit" class="btn-buscar">🔍 BUSCAR</button>
            </form>

            <a href="/" class="btn-cancelar">← CANCELAR</a>
        </div>
    </div>
</body>

</html>
