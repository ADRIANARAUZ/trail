<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Ups! - Trail Running del Bosque al Mar</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            /* Fondo oscuro por si falla la imagen */
            background-image: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), url('/static/img/fondo_certificado_oficial.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Roboto', sans-serif;
            color: white;
        }

        .error-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid #ccff00;
            border-radius: 15px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-family: 'Teko', sans-serif;
            font-size: 3rem;
            color: #ccff00;
            margin: 0;
            text-transform: uppercase;
        }

        p {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        ul {
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px 15px 15px 40px;
            border-radius: 8px;
            color: #fb7185;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #ccff00;
            color: #000;
            text-decoration: none;
            font-family: 'Teko';
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover {
            background: white;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="error-card">
        <h1>¡TE SALISTE DE LA RUTA!</h1>

        <p>{{ mensaje if mensaje else "Algo salió mal en el sendero." }}</p>

        {% if errores %}
        <ul>
            {% for err in errores %}
            <li>{{ err }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <br>
        <a href="/" class="btn">VOLVER A LA PARTIDA</a>
    </div>
</body>

</html>
