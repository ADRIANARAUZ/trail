<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Búsqueda Manual - Trail 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00d2ff;
            --bg-dark: #070d1a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .validator-container {
            width: 100%;
            max-width: 450px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 30px;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.15);
            text-align: center;
        }

        h1 {
            font-family: 'Teko';
            font-size: 2.8rem;
            color: var(--neon-blue);
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 10px;
        }

        .input-cedula {
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #1e293b;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 2.2rem;
            text-align: center;
            font-family: 'Teko';
            letter-spacing: 4px;
            outline: none;
            transition: 0.3s;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        .input-cedula:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 75px;
            /* Más grande para máxima facilidad */
            border-radius: 16px;
            font-family: 'Teko';
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            border: none;
            cursor: pointer;
            background: var(--neon-blue);
            color: black;
            transition: 0.2s;
        }

        .btn-action:active {
            transform: scale(0.96);
        }
    </style>
</head>

<body>

    <div class="validator-container">
        <div style="font-size: 60px; margin-bottom: 10px;">📋</div>
        <h1>BÚSQUEDA MANUAL</h1>
        <p style="color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem;">
            Digita la cédula del corredor
        </p>

        <form action="" method="POST">
            <input type="tel" name="cedula" class="input-cedula" placeholder="0000000000" maxlength="10" required
                autocomplete="off" autofocus>

            <button type="submit" class="btn-action">
                🔍 BUSCAR ATLETA
            </button>
        </form>
    </div>

</body>

</html>
