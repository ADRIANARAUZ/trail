<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Búsqueda Manual - Trail 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>

<body>

    <div class="validator-container">
        <div style="font-size: 60px; margin-bottom: 10px;">📋</div>
        <h1>BÚSQUEDA MANUAL</h1>
        <p style="color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem;">
            Digita la cédula del corredor
        </p>

        <form action="" method="POST">
            <input type="tel" name="cedula" class="input-cedula" placeholder="0000000000" maxlength="10" required
                autocomplete="off" autofocus>

            <button type="submit" class="btn-action">
                🔍 BUSCAR ATLETA
            </button>
        </form>
    </div>

</body>

</html>
